[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.metadata]
name = "financial-messaging"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
authors = ["Tilli Software <oss@tillisoftware.com>"]
license = "MIT"
repository = "https://github.com/tilli-pro/financial-messaging"
homepage = "https://github.com/tilli-pro/financial-messaging"
categories = ["encoding", "parser-implementations", "finance"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.42", features = ["serialize"] }
thiserror = "2"
proptest = "1"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
